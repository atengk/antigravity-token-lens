<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
  <title>Token Lens</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="tl-shell">
    <!-- 顶部栏 -->
    <header class="tl-header">
      <div class="tl-brand">
        <svg class="tl-logo" viewBox="0 0 128 128" aria-hidden="true">
          <defs>
            <linearGradient id="hdr-ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3B82F6"/>
              <stop offset="55%" stop-color="#06B6D4"/>
              <stop offset="100%" stop-color="#10B981"/>
            </linearGradient>
          </defs>
          <circle cx="64" cy="64" r="46" fill="none" stroke="url(#hdr-ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="220 70" transform="rotate(-135 64 64)"/>
          <rect x="46" y="64" width="8" height="16" rx="4" fill="#3B82F6"/>
          <rect x="58" y="48" width="8" height="32" rx="4" fill="#06B6D4"/>
          <rect x="70" y="40" width="8" height="40" rx="4" fill="#10B981"/>
        </svg>
        <span class="tl-title">Token Lens</span>
      </div>

      <div class="tl-actions">
        <button id="btn-back-parent" class="tl-btn tl-btn-chip hidden" type="button"></button>
        <button id="btn-copy-summary" class="tl-btn tl-btn-icon" type="button" aria-label="复制摘要" title="复制摘要">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="4.5" width="7.5" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 4.5V3.4A1.4 1.4 0 0 0 9.1 2H4.4A1.4 1.4 0 0 0 3 3.4v7.2A1.4 1.4 0 0 0 4.4 12h1.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="btn-settings" class="tl-btn tl-btn-icon" type="button" aria-label="上限与阈值设置" title="上限与阈值设置">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-lang" class="tl-btn tl-btn-text" type="button">EN</button>
        <button id="btn-refresh" class="tl-btn tl-btn-icon" type="button" aria-label="立即刷新" title="立即刷新">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.3 8A5.3 5.3 0 1 1 11.7 4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13.5 2.4v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <!-- 当前会话标题与状态栏 -->
    <section class="tl-meta-bar">
      <div class="tl-conv-picker">
        <button id="btn-conv-picker" class="tl-conv-btn" type="button" aria-expanded="false">
          <span id="conv-title" class="tl-conv-title-text">--</span>
          <span class="tl-conv-caret" aria-hidden="true">▾</span>
        </button>
        <div id="conv-dropdown" class="tl-conv-dropdown hidden">
          <input id="input-conv-filter" class="tl-conv-filter" type="search" placeholder="搜索历史会话...">
          <div id="conv-list" class="tl-conv-list"></div>
        </div>
      </div>
      <div class="tl-status-row">
        <span id="status-badge" class="tl-status-pill">
          <span class="tl-dot"></span>
          <span id="status-text">--</span>
        </span>
        <span id="model-badge" class="tl-badge tl-badge-model">--</span>
        <span id="source-badge" class="tl-badge tl-badge-source">--</span>
        <button id="watchdog-badge" class="tl-btn tl-wd-pill hidden" type="button"></button>
        <button id="concurrent-badge" class="tl-btn tl-concurrent-pill hidden" type="button"></button>
      </div>
    </section>

    <!-- 全局账号配额脉冲条（空会话亦可直接观测，点击直达配额用量视图） -->
    <div id="quota-strip" class="tl-quota-strip hidden" role="button" tabindex="0">
      <div class="tl-quota-strip-head">
        <span class="tl-quota-strip-left">
          <span id="quota-strip-group" class="tl-quota-strip-group">--</span>
          <span id="quota-strip-badge" class="tl-quota-mini-badge">--</span>
          <span id="quota-strip-tier" class="tl-quota-tier-badge hidden">--</span>
        </span>
        <span class="tl-quota-strip-right">
          <span id="quota-strip-alert" class="tl-quota-risk-tag hidden">--</span>
          <button id="btn-quota-strip-refresh" class="tl-btn tl-btn-mini tl-quota-refresh-btn" type="button" aria-label="刷新配额" title="立即刷新账号配额"><span class="tl-refresh-glyph" aria-hidden="true">↻</span></button>
        </span>
      </div>
      <div id="quota-strip-buckets" class="tl-quota-strip-buckets"></div>
    </div>

    <!-- 可展开设置面板 -->
    <section id="settings-drawer" class="tl-card tl-settings hidden">
      <div class="tl-card-head">
        <span id="lbl-settings-title" class="tl-card-title">上限与预警设置</span>
        <button id="btn-close-settings" class="tl-btn tl-btn-text" type="button">✕</button>
      </div>
      <div class="tl-settings-tabs" role="tablist">
        <button id="btn-settings-tab-context" class="tl-settings-tab is-active" data-settings-tab="context" type="button">上下文与阈值</button>
        <button id="btn-settings-tab-watchdog" class="tl-settings-tab" data-settings-tab="watchdog" type="button">可用性巡检与通知</button>
      </div>
      <div id="settings-pane-context" class="tl-settings-grid">
        <label class="tl-field">
          <span id="lbl-limit-input">当前模型上下文上限 (Tokens)</span>
          <div class="tl-inline-input">
            <input id="input-max-tokens" type="number" min="1024" step="1024" placeholder="自动">
            <button id="btn-reset-limit" class="tl-btn tl-btn-ghost" type="button">恢复默认</button>
          </div>
          <div class="tl-preset-row">
            <button class="tl-chip-btn" data-limit="128000" title="128,000 tokens · 12.8万" type="button">128K</button>
            <button class="tl-chip-btn" data-limit="200000" title="200,000 tokens · 20.0万" type="button">200K</button>
            <button class="tl-chip-btn" data-limit="512000" title="512,000 tokens · 51.2万" type="button">512K</button>
            <button class="tl-chip-btn" data-limit="1048576" title="1,048,576 tokens · 104.9万" type="button">1M</button>
            <button class="tl-chip-btn" data-limit="2097152" title="2,097,152 tokens · 209.7万" type="button">2M</button>
          </div>
        </label>
        <div class="tl-two-fields">
          <label class="tl-field">
            <span id="lbl-warn-at">注意阈值 (%)</span>
            <input id="input-warn-at" type="number" min="10" max="95">
          </label>
          <label class="tl-field">
            <span id="lbl-crit-at">预警阈值 (%)</span>
            <input id="input-crit-at" type="number" min="15" max="99">
          </label>
        </div>
        <label class="tl-field">
          <span id="lbl-unit-system">统计展示单位制</span>
          <select id="input-unit-system">
            <option value="auto">跟随语言（中文用万/亿，英文用 K/M/B）</option>
            <option value="zh">中文大数 (万 / 亿)</option>
            <option value="intl">国际缩写 (K / M / B)</option>
          </select>
        </label>
        <div class="tl-settings-foot">
          <button id="btn-save-settings" class="tl-btn tl-btn-primary" type="button">保存配置</button>
        </div>
      </div>

      <div id="settings-pane-watchdog" class="tl-settings-grid hidden">
        <div id="wd-activation-hint" class="tl-wd-hint">重启 Antigravity 后打开一次 Token Lens 面板即可激活后台巡检（切走标签页仍可持续监控）。</div>
        <div class="tl-wd-status-box">
          <span id="wd-status-summary" class="tl-wd-status-text">--</span>
          <span id="wd-active-incidents" class="tl-wd-inc-badge hidden">--</span>
        </div>

        <label class="tl-check-row">
          <input id="input-wd-enabled" type="checkbox">
          <span id="lbl-wd-enabled">启用后台可用性巡检（失败 / 重试卡死 / 额满 / LS 失联）</span>
        </label>
        <label class="tl-check-row">
          <input id="input-wd-recovery" type="checkbox">
          <span id="lbl-wd-recovery">故障或配额重置恢复后发送 [已恢复] 通知</span>
        </label>

        <div class="tl-two-fields">
          <label class="tl-field">
            <span id="lbl-wd-retry-count">重试触发次数</span>
            <input id="input-wd-retry-count" type="number" min="1" max="20">
          </label>
          <label class="tl-field">
            <span id="lbl-wd-retry-sec">重试超时 (秒)</span>
            <input id="input-wd-retry-sec" type="number" min="15" max="1800">
          </label>
          <label class="tl-field">
            <span id="lbl-wd-stall-sec">静默卡死 (秒)</span>
            <input id="input-wd-stall-sec" type="number" min="30" max="3600">
          </label>
          <label class="tl-field">
            <span id="lbl-wd-cooldown-min">同故障冷却 (分)</span>
            <input id="input-wd-cooldown-min" type="number" min="1" max="240">
          </label>
        </div>

        <div class="tl-wd-sec-head">
          <span id="lbl-wd-channels" class="tl-card-title">通知通道 (Webhook)</span>
          <button id="btn-wd-add-channel" class="tl-btn tl-btn-ghost" type="button">+ 添加通道</button>
        </div>
        <div id="wd-channel-list" class="tl-wd-channels"></div>

        <div id="wd-channel-editor" class="tl-wd-editor hidden">
          <div class="tl-two-fields">
            <label class="tl-field">
              <span id="lbl-wd-ch-type">平台类型</span>
              <select id="input-wd-ch-type">
                <option value="feishu">飞书机器人</option>
                <option value="dingtalk">钉钉机器人</option>
                <option value="wecom">企业微信</option>
                <option value="webhook">通用 Webhook</option>
              </select>
            </label>
            <label class="tl-field">
              <span id="lbl-wd-ch-name">通道名称</span>
              <input id="input-wd-ch-name" type="text" maxlength="48" placeholder="如：主力飞书群">
            </label>
          </div>
          <label class="tl-field">
            <span id="lbl-wd-ch-url">Webhook URL</span>
            <input id="input-wd-ch-url" type="url" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/...">
          </label>
          <div id="wd-ch-secret-wrap" class="tl-field">
            <span id="lbl-wd-ch-secret">加签密钥 Secret（可选）</span>
            <div class="tl-inline-input">
              <input id="input-wd-ch-secret" type="password" autocomplete="off" placeholder="留空则不加签">
              <button id="btn-wd-ch-clear-secret" class="tl-btn tl-btn-ghost hidden" type="button">清除密钥</button>
            </div>
          </div>
          <div class="tl-wd-editor-actions">
            <button id="btn-wd-ch-cancel" class="tl-btn tl-btn-ghost" type="button">取消</button>
            <button id="btn-wd-ch-test" class="tl-btn tl-btn-ghost" type="button">测试此通道</button>
            <button id="btn-wd-ch-apply" class="tl-btn tl-btn-primary" type="button">确认通道</button>
          </div>
        </div>

        <div id="wd-feedback" class="tl-wd-feedback hidden"></div>

        <div class="tl-settings-foot tl-wd-foot">
          <button id="btn-wd-test-all" class="tl-btn tl-btn-ghost" type="button">测试启用通道</button>
          <button id="btn-wd-save" class="tl-btn tl-btn-primary" type="button">保存巡检配置</button>
        </div>

        <div class="tl-wd-sec-head">
          <span id="lbl-wd-deliveries" class="tl-card-title">最近告警与投递流水</span>
        </div>
        <div id="wd-delivery-list" class="tl-wd-deliveries"></div>
      </div>
    </section>

    <!-- 空状态 / 加载状态 -->
    <section id="empty-state" class="tl-card tl-empty hidden">
      <div id="empty-title" class="tl-empty-title">暂无会话数据</div>
      <div id="empty-desc" class="tl-empty-desc">在对话发送消息后，实时上下文与 Token 指标将自动显示在此处。</div>
      <div class="tl-empty-actions">
        <button id="btn-empty-stats" class="tl-btn tl-btn-ghost" type="button">查看日/周/月/年用量统计</button>
      </div>
    </section>

    <!-- 空会话状态下的独立配额与统计详情容器 -->
    <section id="empty-quota-card" class="tl-card hidden"></section>
    <section id="empty-stats-card" class="tl-card hidden"></section>

    <!-- 主内容区域 -->
    <main id="main-content" class="tl-main hidden">
      <!-- 1. 上下文水位主卡 -->
      <section class="tl-card tl-context-card">
        <div class="tl-card-head">
          <span id="lbl-context-title" class="tl-card-title">上下文水位</span>
          <div class="tl-context-nums">
            <span id="ctx-used" class="tl-num-strong">--</span>
            <span class="tl-sep">/</span>
            <span id="ctx-max" class="tl-num-muted">--</span>
            <span id="ctx-pct" class="tl-pct-pill">--</span>
          </div>
        </div>

        <div class="tl-progress-wrap">
          <div class="tl-progress-track">
            <div id="ctx-bar" class="tl-progress-fill" style="width: 0%"></div>
            <div id="ctx-warn-mark" class="tl-threshold-mark tl-mark-warn" style="left: 70%"></div>
            <div id="ctx-crit-mark" class="tl-threshold-mark tl-mark-crit" style="left: 85%"></div>
          </div>
        </div>

        <div class="tl-context-sub">
          <span id="ctx-remaining" class="tl-muted">--</span>
          <span id="ctx-max-source" class="tl-muted">--</span>
        </div>

        <div id="ctx-alert-banner" class="tl-alert hidden">
          <span id="ctx-alert-text">--</span>
          <button id="btn-copy-compact" class="tl-btn tl-btn-compact" type="button">/compact</button>
        </div>

        <!-- 上下文结构迷你分段条 -->
        <div id="breakdown-mini" class="tl-breakdown-mini hidden">
          <div id="breakdown-seg-bar" class="tl-seg-bar"></div>
          <div id="breakdown-legend" class="tl-seg-legend"></div>
        </div>
      </section>

      <!-- 2. 核心性能双指标卡（流式速率 + 缓存命中） -->
      <section class="tl-grid-2">
        <!-- 速率卡片 -->
        <article class="tl-card tl-metric-card">
          <div class="tl-card-head">
            <span id="lbl-speed-title" class="tl-card-title">生成速率</span>
            <button id="btn-toggle-chart" class="tl-btn tl-btn-mini" type="button">tok/s</button>
          </div>
          <div class="tl-hero-row">
            <span id="tp-main" class="tl-hero-num">--</span>
            <span id="tp-unit" class="tl-hero-unit">tok/s</span>
          </div>
          <div id="tp-sub-line1" class="tl-sub-meta">--</div>
          <div id="tp-sub-line2" class="tl-sub-meta">--</div>
          <div id="tp-sparkline" class="tl-sparkline" aria-hidden="true"></div>
        </article>

        <!-- 缓存命中卡片 -->
        <article class="tl-card tl-metric-card">
          <div class="tl-card-head">
            <span id="lbl-cache-title" class="tl-card-title">缓存命中</span>
            <span id="cache-rebuild-pill" class="tl-warn-tag hidden">--</span>
          </div>
          <div class="tl-hero-row">
            <span id="cache-main" class="tl-hero-num">--</span>
            <span id="cache-latest" class="tl-hero-subpill">--</span>
          </div>
          <div id="cache-saved" class="tl-sub-meta">--</div>
          <div id="cache-detail" class="tl-sub-meta">--</div>
          <div class="tl-cache-bar-wrap">
            <div id="cache-bar" class="tl-cache-bar" style="width: 0%"></div>
          </div>
          <div id="cache-sparkline" class="tl-sparkline tl-sparkline-tight" aria-hidden="true"></div>
        </article>
      </section>

      <!-- 3. 累计消耗三层汇总 -->
      <section class="tl-card tl-totals-card">
        <div class="tl-card-head">
          <span id="lbl-totals-title" class="tl-card-title">会话累计消耗</span>
          <span id="totals-grand-pill" class="tl-badge">--</span>
        </div>
        <div class="tl-totals-grid">
          <div class="tl-total-cell">
            <span id="lbl-tot-main" class="tl-cell-label">主会话</span>
            <span id="tot-main-val" class="tl-cell-num">--</span>
          </div>
          <div class="tl-total-cell">
            <span id="lbl-tot-sub" class="tl-cell-label">子代理 (0)</span>
            <span id="tot-sub-val" class="tl-cell-num">--</span>
          </div>
          <div class="tl-total-cell">
            <span id="lbl-tot-grand" class="tl-cell-label">总计</span>
            <span id="tot-grand-val" class="tl-cell-num tl-num-accent">--</span>
          </div>
        </div>
        <div id="tot-breakdown-line" class="tl-totals-footer">--</div>
        <div id="tot-timing-line" class="tl-totals-footer tl-totals-timing hidden">--</div>
      </section>

      <!-- 4. 下钻 Tabs -->
      <section class="tl-card tl-tabs-card">
        <nav class="tl-tabs" role="tablist">
          <button class="tl-tab is-active" data-tab="breakdown" role="tab" type="button">上下文构成</button>
          <button class="tl-tab" data-tab="turns" role="tab" type="button">逐轮明细</button>
          <button class="tl-tab" data-tab="subagents" role="tab" type="button">子代理</button>
          <button class="tl-tab" data-tab="diagnostics" role="tab" type="button">工具与诊断</button>
          <button class="tl-tab" data-tab="quota" role="tab" type="button">配额用量</button>
          <button class="tl-tab" data-tab="stats" role="tab" type="button">用量统计</button>
        </nav>

        <div id="tab-breakdown" class="tl-tab-pane"></div>
        <div id="tab-turns" class="tl-tab-pane hidden"></div>
        <div id="tab-subagents" class="tl-tab-pane hidden"></div>
        <div id="tab-diagnostics" class="tl-tab-pane hidden"></div>
        <div id="tab-quota" class="tl-tab-pane hidden"></div>
        <div id="tab-stats" class="tl-tab-pane hidden"></div>
      </section>
    </main>
  </div>
  <script src="/units.js"></script>
  <script src="/app.js"></script>
</body>
</html>
