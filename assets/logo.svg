<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="tl-ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tl-lens" x1="36" y1="36" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <!-- 外圈透视弧（保留约10%留白边距） -->
  <circle cx="64" cy="64" r="46" stroke="url(#tl-ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="220 70" transform="rotate(-135 64 64)"/>
  <!-- 内镜面填充 -->
  <circle cx="64" cy="64" r="34" fill="url(#tl-lens)" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Token 柱状微脉冲 -->
  <rect x="46" y="64" width="7" height="16" rx="3.5" fill="#3B82F6"/>
  <rect x="57" y="50" width="7" height="30" rx="3.5" fill="#06B6D4"/>
  <rect x="68" y="42" width="7" height="38" rx="3.5" fill="#10B981"/>
  <rect x="79" y="56" width="7" height="24" rx="3.5" fill="#38BDF8"/>
  <!-- 右下高光节点 -->
  <circle cx="96" cy="96" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
</svg>
